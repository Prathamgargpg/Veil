# Render Blueprint (FREE plan): New > Blueprint > pick this repo.
# Free plan limits: sleeps after 15 min idle (first visit then takes ~1 min), and local files are wiped on every
# spin-down/redeploy, so accounts and ratings RESET. For persistent data use render.paid.yaml instead.
services:
  - type: web
    name: veil-ascent
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0   # better-sqlite3 has no build for the newest Node yet
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
