# PAID variant (always-on + persistent disk so accounts survive). To use: replace render.yaml with this file.
services:
  - type: web
    name: veil-ascent
    runtime: node
    plan: starter            # always-on; disk keeps accounts and ratings
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0   # better-sqlite3 has no build for the newest Node yet
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB
        value: /data/data.db
    disk:
      name: veil-data
      mountPath: /data
      sizeGB: 1
